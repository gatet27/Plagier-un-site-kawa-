<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blue Moon Factory — Images principales</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:850px;margin:40px auto;padding:0 20px;background:#f5f8ff;color:#172033}
.card{background:white;border-radius:18px;padding:24px;box-shadow:0 8px 30px #0001}
button{font-size:16px;padding:12px 18px;border:0;border-radius:12px;background:#90b9e8;color:#10223b;font-weight:700;cursor:pointer;margin:5px}
button:disabled{opacity:.5}
#status{margin:18px 0;font-weight:600}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.item{background:#fff;border-radius:12px;padding:8px;font-size:12px}
.item img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
small{color:#5d6778}
</style>
</head>
<body>
<div class="card">
<h1>Blue Moon Factory</h1>
<p>Récupère <b>uniquement l’image principale</b> de chaque article du catalogue.</p>
<p><small>Le catalogue public affichait 177 articles lors de la création de cet outil. Le nombre chargé peut évoluer.</small></p>
<button id="load">1 — Charger le catalogue</button>
<button id="download" disabled>2 — Télécharger toutes les images</button>
<div id="status">Prêt.</div>
<div id="grid"></div>
</div>
<script>
const endpoint='https://bluemoonfactory.com/collections/all/products.json?limit=250';
let products=[];

function safeName(s){
 return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'')
 .replace(/[<>:"/\\|?*\x00-\x1F]/g,'-').replace(/\s+/g,' ').trim().slice(0,120);
}
function ext(url){
 let m=url.split('?')[0].match(/\.([a-zA-Z0-9]{2,5})$/);
 return m ? '.'+m[1].toLowerCase() : '.jpg';
}
async function getCatalog(){
 const status=document.getElementById('status');
 status.textContent='Chargement du catalogue…';
 try{
   const r=await fetch(endpoint);
   if(!r.ok) throw new Error('HTTP '+r.status);
   const data=await r.json();
   products=(data.products||[]).filter(p=>p.images && p.images.length);
   status.textContent=products.length+' articles avec une image principale trouvés.';
   document.getElementById('download').disabled=!products.length;
   const grid=document.getElementById('grid');
   grid.innerHTML='';
   products.forEach((p,i)=>{
      const d=document.createElement('div'); d.className='item';
      const src=p.images[0].src;
      d.innerHTML='<img loading="lazy" src="'+src.replace(/"/g,'&quot;')+'"><div>'+(i+1)+'. '+p.title.replace(/</g,'&lt;')+'</div>';
      grid.appendChild(d);
   });
 }catch(e){
   status.innerHTML='Impossible de charger automatiquement le catalogue depuis ce fichier.<br><br>'+
   'Solution : ouvre <b>bluemoonfactory.com</b> dans Safari/Chrome puis réessaie, ou autorise les téléchargements multiples si le navigateur le demande.<br><small>'+e+'</small>';
 }
}

async function downloadAll(){
 const status=document.getElementById('status');
 document.getElementById('download').disabled=true;
 let ok=0, fail=0;
 for(let i=0;i<products.length;i++){
   const p=products[i], url=p.images[0].src;
   status.textContent=`Téléchargement ${i+1}/${products.length} — ${p.title}`;
   try{
     const r=await fetch(url);
     if(!r.ok) throw new Error();
     const blob=await r.blob();
     const a=document.createElement('a');
     a.href=URL.createObjectURL(blob);
     a.download=String(i+1).padStart(3,'0')+' - '+safeName(p.title)+ext(url);
     document.body.appendChild(a); a.click(); a.remove();
     setTimeout(()=>URL.revokeObjectURL(a.href),5000);
     ok++;
     await new Promise(res=>setTimeout(res,180));
   }catch(e){ fail++; }
 }
 status.textContent=`Terminé : ${ok} images téléchargées${fail ? ', '+fail+' échec(s)' : ''}.`;
 document.getElementById('download').disabled=false;
}
document.getElementById('load').onclick=getCatalog;
document.getElementById('download').onclick=downloadAll;
</script>
</body>
</html>
